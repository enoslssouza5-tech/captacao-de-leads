<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>Captação de Leads</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-conta="atlas">
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><i data-ic="target"></i>Captação de Leads</div>
    <div class="conta" id="conta"><button data-c="atlas">Atlas</button><button data-c="nexora">Nexora</button></div>
    <div class="grp">Operar</div>
    <button class="nav" data-v="hoje"><span data-ic="today"></span>Hoje<b id="b-hoje"></b></button>
    <button class="nav" data-v="leads"><span data-ic="users"></span>Leads<b id="b-leads"></b></button>
    <button class="nav" data-v="radar"><span data-ic="radar"></span>Radar<b id="b-radar"></b></button>
    <button class="nav" data-v="inbox"><span data-ic="inbox"></span>Inbox<b id="b-inbox"></b></button>
    <div class="grp">Analisar</div>
    <button class="nav" data-v="painel"><span data-ic="chart"></span>Painel</button>
    <button class="nav" data-v="aprendizado"><span data-ic="learn"></span>Aprendizado</button>
    <button class="nav" data-v="financeiro"><span data-ic="wallet"></span>Financeiro</button>
    <div class="side-foot">
      <button class="nav" data-v="config"><span data-ic="settings"></span>Configurações</button>
      <button class="nav" id="tema"><span data-ic="sun"></span>Tema</button>
      <div class="saude" id="saude" title="Saúde do sistema"><i></i><span>Verificando</span></div>
    </div>
  </aside>
  <main class="main" id="main"><div class="wrap">
    <div class="top"><div><h1 id="ttl"></h1><div class="sub" id="sub"></div></div><div class="acoes" id="acoes"></div></div>
    <div id="view"></div>
  </div></main>
</div>
<nav class="tabbar" id="tabbar">
  <button data-v="hoje"><span data-ic="today"></span>Hoje<span class="bd" id="t-hoje" hidden></span></button>
  <button data-v="leads"><span data-ic="users"></span>Leads</button>
  <button data-v="radar"><span data-ic="radar"></span>Radar<span class="bd" id="t-radar" hidden></span></button>
  <button data-v="inbox"><span data-ic="inbox"></span>Inbox<span class="bd" id="t-inbox" hidden></span></button>
  <button data-v="mais"><span data-ic="more"></span>Mais</button>
</nav>
<div id="overlay"></div>
<div id="toasts"></div>
<dialog id="dlg"></dialog>
<script src="/js/core.js"></script>
<script src="/js/charts.js"></script>
<script src="/js/v-painel.js"></script>
<script src="/js/v-hoje.js"></script>
<script src="/js/v-leads.js"></script>
<script src="/js/v-radar.js"></script>
<script src="/js/v-inbox.js"></script>
<script src="/js/v-analise.js"></script>
<script src="/js/v-config.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
